[build]
  publish = "."
  # There is no bundler, so there is nothing to inline an environment variable
  # into. This rewrites config.js — the one file the page reads its Supabase
  # settings out of — from SUPABASE_URL, SUPABASE_PROXY_URL and
  # SUPABASE_ANON_KEY. A no-op when none are set, so the committed defaults
  # keep working. It refuses to write a service_role key, or a SUPABASE_URL
  # that is not a Supabase project URL.
  command = "node scripts/build-config.mjs"

# The receipt scanner's cloud readers and the admin auth actions. With no
# provider key set the scanner returns 501 and the app falls back to on-device
# OCR; with keys set but all of them failing it returns 503 and the app asks.
[functions]
  directory = "netlify/functions"
  # The scanner walks a chain of providers, and a congested free tier can take
  # tens of seconds to say no. 26 is Netlify's ceiling for a synchronous
  # function; scan.mjs keeps its own budget just under it so it answers rather
  # than being killed mid-request.
  timeout = 26

[build.environment]
  NODE_VERSION = "18"

  # Left ON deliberately. It is what would catch SUPABASE_SERVICE_ROLE_KEY or
  # any of the model provider keys ending up in the deployed files, which is
  # the one mistake here that would actually matter.
  #
  # The omitted keys are public by design — the publishable key, the project
  # URL and the proxy are written into config.js on purpose and are delivered
  # to every visitor. Without the omission the scanner would fail every build
  # for finding exactly what it was told to put there.
  #
  # SUPABASE_SERVICE_ROLE_KEY and GEMINI_API_KEY are deliberately NOT omitted.
  # Catching one of those in a deployed file is the entire point.
  #
  # The VITE_ names are the old spellings, kept here only while Netlify is
  # being tidied up. Delete them from this line once they are gone from the
  # dashboard.
  SECRETS_SCAN_ENABLED = "true"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_PROXY_URL,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_PROXY_URL"
  # The publish directory is the repo root, so anything npm installs would be
  # deployed with the site. puppeteer-core is a test-only dependency — never
  # install it here.
  NPM_FLAGS = "--omit=dev --no-audit --no-fund"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://*.workers.dev; font-src 'self' data:;"

# index.html must never be served stale: it is what points at the versioned
# script.js / style.css.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker must never be served stale, or a deploy cannot replace
# the shell it caches — the browser would keep handing out the old one.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Neither the tests nor the build scripts are part of the app, but the publish
# directory is the repo root, so both are uploaded with it.
[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404

# Test files are not part of the app.
[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
